function injectLPCss(){
  if(document.getElementById('lp-css')) return;
  const s=document.createElement('style');s.id='lp-css';s.textContent=LP_CSS;document.head.appendChild(s);
}

/* Reveal observer — VISIBLE BY DEFAULT. Adds .js-reveal to enable the hidden
   entrance state, then reveals via IntersectionObserver. Safety net DROPS
   .js-reveal entirely after 1.5s so nothing can stay invisible. */
function useReveal(){
  useEffectL(()=>{
    let raf;
    const root = document.documentElement;
    const reveal = (el) => el.classList.add('in');
    root.classList.add('js-reveal');
    const observe = () => {
      if(typeof IntersectionObserver === 'undefined'){
        root.classList.remove('js-reveal');
        return null;
      }
      const obs=new IntersectionObserver(entries=>{
        entries.forEach(e=>{ if(e.isIntersecting){ reveal(e.target); obs.unobserve(e.target);} });
      },{ threshold:.05, rootMargin:'0px 0px -20px 0px' });
      document.querySelectorAll('.reveal:not(.in)').forEach(el=>obs.observe(el));
      return obs;
    };
    raf = requestAnimationFrame(() => {
      const obs = observe();
      // Safety net — anything still hidden after 1.5s: reveal it, and drop the
      // gate so the hidden rule can no longer apply to anything.
      setTimeout(()=>{
        document.querySelectorAll('.reveal:not(.in)').forEach(reveal);
        root.classList.remove('js-reveal');
      }, 1500);
      // Watch for new .reveal nodes appearing (lazy-rendered sections)
      const mo = new MutationObserver(()=>{ if(obs) document.querySelectorAll('.reveal:not(.in)').forEach(el=>obs.observe(el)); });
      mo.observe(document.body,{childList:true,subtree:true});
    });
    return ()=>cancelAnimationFrame(raf);
  },[]);
}

/* Animated counter */
function useCount(target, dur=1400, start=true){
  const [v,setV] = useStateL(0);
  useEffectL(()=>{
    if(!start) return;
    let raf, t0;
    const step=t=>{ if(!t0)t0=t; const p=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-p,3); setV(Math.round(target*e)); if(p<1) raf=requestAnimationFrame(step); };
    raf=requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  },[target,dur,start]);
  return v;
}
function Counter({to, prefix="", suffix="", format=v=>v.toLocaleString()}){
  const ref=useRefL(null); const [on,setOn]=useStateL(false);
  useEffectL(()=>{
    if(!ref.current) return;
    const o=new IntersectionObserver(([e])=>{ if(e.isIntersecting){ setOn(true); o.disconnect();} },{threshold:.3});
    o.observe(ref.current); return ()=>o.disconnect();
  },[]);
  const v=useCount(to,1400,on);
  return <span ref={ref}>{prefix}{format(v)}{suffix}</span>;
}

/* Sparkline */
function Spark({pts, w=120, h=36, stroke="var(--emerald)", fill}){
  const max=Math.max(...pts), min=Math.min(...pts), r=max-min||1;
  const d=pts.map((v,i)=>{const x=(i/(pts.length-1))*w; const y=h-((v-min)/r)*(h-4)-2; return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ');
  const area=`${d} L${w} ${h} L0 ${h} Z`;
  return <svg viewBox={`0 0 ${w} ${h}`} width={w} height={h} style={{display:'block',maxWidth:'100%',height:'auto',overflow:'visible'}}>
    {fill && <path d={area} fill={fill}/>}
    <path d={d} fill="none" stroke={stroke} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
    <circle cx={w} cy={h-((pts[pts.length-1]-min)/r)*(h-4)-2} r="3" fill={stroke}/>
  </svg>;
}

Object.assign(window,{ injectLPCss, useReveal, Counter, Spark });


/* Hero section — universal positioning */

function ForecastChart() {
  const w = 540,h = 130,p = 4;
  const margin = [2, 4, 7, 11, 14, 18, 22, 27, 33, 38, 44, 50, 56, 63, 71, 79, 87, 96, 105, 114, 124, 135, 146, 157, 170, 182, 196, 210, 225, 240];
  const reward = [3, 5, 8, 10, 12, 15, 18, 21, 25, 28, 32, 36, 40, 45, 50, 55, 61, 66, 72, 78, 84, 90, 96, 103, 109, 116, 122, 129, 135, 142];
  const max = Math.max(...margin, ...reward);
  const x = (i) => p + i / (margin.length - 1) * (w - 2 * p);
  const y = (v) => h - p - v / max * (h - 2 * p);
  const path = (arr) => arr.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const area = (arr, color) => `${path(arr)} L${x(arr.length - 1)} ${h - p} L${x(0)} ${h - p} Z`;
  return <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={h} preserveAspectRatio="none">
    <defs>
      <linearGradient id="lpgM" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--emerald)" stopOpacity=".28" /><stop offset="100%" stopColor="var(--emerald)" stopOpacity="0" /></linearGradient>
      <linearGradient id="lpgR" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--rose)" stopOpacity=".22" /><stop offset="100%" stopColor="var(--rose)" stopOpacity="0" /></linearGradient>
    </defs>
    {[.25, .5, .75].map((p, i) => <line key={i} x1="0" x2={w} y1={h * p} y2={h * p} stroke="var(--line)" strokeDasharray="2 4" />)}
    <path d={area(margin)} fill="url(#lpgM)" />
    <path d={area(reward)} fill="url(#lpgR)" />
    <path d={path(margin)} fill="none" stroke="var(--emerald)" strokeWidth="2" strokeLinecap="round" />
    <path d={path(reward)} fill="none" stroke="var(--rose)" strokeWidth="2" strokeLinecap="round" />
    <circle cx={x(margin.length - 1)} cy={y(margin[margin.length - 1])} r="4" fill="var(--emerald)" />
  </svg>;
}

function RepeatCurves() {
  const w = 260,h = 110,p = 4;
  const reward = [100, 92, 84, 78, 72, 68, 64, 60, 57, 54, 51, 49, 47, 46, 45];
  const discount = [100, 76, 58, 46, 38, 33, 30, 28, 27, 26, 25, 24, 24, 24, 23];
  const x = (i) => p + i / (reward.length - 1) * (w - 2 * p);
  const y = (v) => h - p - v / 100 * (h - 2 * p);
  const path = (arr) => arr.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  return <svg viewBox={`0 0 ${w} ${h + 18}`} width="100%" height={h + 18}>
    <path d={path(reward)} fill="none" stroke="var(--emerald)" strokeWidth="2" strokeLinecap="round" />
    <path d={path(discount)} fill="none" stroke="var(--rose)" strokeWidth="2" strokeLinecap="round" strokeDasharray="3 3" />
    <circle cx={x(reward.length - 1)} cy={y(reward[reward.length - 1])} r="3" fill="var(--emerald)" />
    <circle cx={x(discount.length - 1)} cy={y(discount[discount.length - 1])} r="3" fill="var(--rose)" />
    <text x={4} y={h + 14} fontSize="9" fill="var(--ink-3)">Day 1</text>
    <text x={w - 22} y={h + 14} fontSize="9" fill="var(--ink-3)">Day 30</text>
  </svg>;
}

    <path d={`${path} L${x(series.length - 1)} ${h - p} L${x(0)} ${h - p} Z`} fill="url(#hid)" />
    <path d={path} fill="none" stroke="#d97706" strokeWidth="2.5" strokeLinecap="round" />
    <circle cx={x(10)} cy={y(46)} r="5" fill="#d97706" />
    <g fontSize="10" fill="var(--ink-3)">
      <text x={20} y={h + 18}>Offer #1</text>
      <text x={w - 60} y={h + 18}>Offer #20</text>
      <text x={4} y={y(50) + 3}>50%</text>
      <text x={4} y={y(25) + 3}>25%</text>
      <text x={4} y={y(0) + 3}>0%</text>
    </g>
  </svg>;
}

window.HiddenImpact = HiddenImpact;

/* Premium lead-capture modal — strategic qualification fields */
const { useState: useStateM, useEffect: useEffectM } = React;

function LeadModal({ open, onClose }){
  const [step, setStep] = useStateM(0);
  const [data, setData] = useStateM({
    email:'', company:'', category:'', mau:'', spend:'',
    challenge:'', offers:[], concern:'', planning:'', launches:'',
    survey:'', linkedin:''
  });
  const [submitted, setSubmitted] = useStateM(false);

  useEffectM(()=>{
    if(open){ document.body.style.overflow='hidden'; }
    else { document.body.style.overflow=''; setStep(0); setSubmitted(false); }
    const onKey=(e)=>{ if(e.key==='Escape') onClose(); };
    window.addEventListener('keydown',onKey);
    return ()=>{ document.body.style.overflow=''; window.removeEventListener('keydown',onKey); };
  },[open]);

  if(!open) return null;
  const upd = (k,v) => setData(d=>({...d,[k]:v}));
  const toggleOffer = (o) => setData(d=>({...d, offers: d.offers.includes(o)? d.offers.filter(x=>x!==o):[...d.offers,o]}));

  const steps = [
    { t:'About you', fields:['email','company','linkedin'] },
    { t:'Your business', fields:['category','mau','spend','launches'] },
    { t:'How you run offers today', fields:['offers','planning'] },
    { t:'Your biggest concern', fields:['concern','challenge','survey'] },
  ];
  const canNext = (() => {
    if(step===0) return data.email && data.company;
    if(step===1) return data.category && data.mau && data.spend;
    if(step===2) return data.offers.length>0 && data.planning;
    return data.concern;
  })();

  const overlay = {
    position:'fixed', inset:0, zIndex:1000, display:'grid', placeItems:'center',
    background:'rgba(10,31,21,.55)', backdropFilter:'blur(12px)',
    padding:24, animation:'lpm-fade .25s ease both'
  };
  const card = {
    width:'min(640px,100%)', maxHeight:'min(720px,90vh)',
    background:'#fff', borderRadius:24, overflow:'hidden',
    display:'flex', flexDirection:'column',
    boxShadow:'0 40px 100px -20px rgba(0,0,0,.40), 0 1px 0 rgba(255,255,255,.4) inset',
    animation:'lpm-pop .35s cubic-bezier(.2,.8,.2,1) both'
  };

  return <div style={overlay} onClick={onClose}>
    <style>{`
      @keyframes lpm-fade { from { opacity:0 } to { opacity:1 } }
      @keyframes lpm-pop { from { opacity:0; transform:translateY(20px) scale(.98) } to { opacity:1; transform:none } }
      .lpm-fld { display:flex; flex-direction:column; gap:6px; margin-bottom:14px }
      .lpm-l { font-size:11px; font-weight:600; color:var(--ink-2); letter-spacing:.04em; text-transform:uppercase }
      .lpm-i { width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:#fff; transition:border-color .12s,box-shadow .12s; outline:none; font-family:inherit; color:var(--ink) }
      .lpm-i:focus { border-color:var(--emerald); box-shadow:0 0 0 3px rgba(52,211,153,.18) }
      .lpm-i::placeholder { color:var(--ink-4) }
      .lpm-chips { display:flex; flex-wrap:wrap; gap:6px }
      .lpm-chip { padding:8px 14px; border:1px solid var(--line); border-radius:99px; background:#fff; cursor:pointer; font-size:13px; color:var(--ink-2); transition:all .14s; user-select:none }
      .lpm-chip:hover { border-color:var(--ink-4) }
      .lpm-chip.on { border-color:var(--emerald); background:var(--emerald-soft); color:var(--emerald-2); font-weight:500 }
      .lpm-step-dot { width:6px; height:6px; border-radius:50%; background:var(--bg-4); transition:background .2s, width .2s }
      .lpm-step-dot.on { background:var(--emerald); width:24px; border-radius:99px }
    `}</style>
    <div style={card} onClick={e=>e.stopPropagation()}>
      {submitted ? (
        <div style={{padding:'56px 40px',textAlign:'center'}}>
          <div style={{width:60,height:60,borderRadius:18,background:'linear-gradient(135deg,var(--emerald),var(--mint))',display:'grid',placeItems:'center',margin:'0 auto 22px',color:'#fff',fontFamily:'var(--display)',fontSize:30}}>✓</div>
          <h3 style={{fontFamily:'var(--display)',fontSize:32,fontWeight:400,letterSpacing:'-.01em',lineHeight:1.1,marginBottom:14}}>Thanks.</h3>
          <p style={{fontSize:15,color:'var(--ink-2)',lineHeight:1.6,maxWidth:420,margin:'0 auto 26px'}}>Our team may reach out for product research, strategy conversations, or early feedback sessions. We'll be selective about who we onboard first.</p>
          <button className="lp-btn primary" onClick={onClose}>Close</button>
        </div>
      ) : (<>
        {/* Header */}
        <div style={{padding:'24px 32px 18px',borderBottom:'1px solid var(--line)',display:'flex',alignItems:'center',justifyContent:'space-between',gap:16}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:10.5,letterSpacing:'.12em',textTransform:'uppercase',color:'var(--emerald-2)',fontWeight:600,marginBottom:6}}>Request access · {step+1}/{steps.length}</div>
            <h3 style={{fontFamily:'var(--display)',fontSize:24,fontWeight:400,letterSpacing:'-.01em',lineHeight:1.1}}>{steps[step].t}</h3>
          </div>
          <button onClick={onClose} aria-label="Close" style={{width:32,height:32,borderRadius:9,border:'1px solid var(--line)',background:'#fff',display:'grid',placeItems:'center',cursor:'pointer',color:'var(--ink-3)',fontSize:14,flexShrink:0}}>✕</button>
        </div>

        {/* Stepper */}
        <div style={{padding:'14px 32px',borderBottom:'1px solid var(--line)',display:'flex',alignItems:'center',gap:8}}>
          {steps.map((_,i)=><span key={i} className={'lpm-step-dot '+(i<=step?'on':'')}/>)}
          <span style={{marginLeft:'auto',fontSize:11,color:'var(--ink-3)'}}>Esc to close</span>
        </div>

        {/* Body */}
        <div style={{flex:1,overflowY:'auto',padding:'24px 32px'}}>
          {step===0 && <>
            <div className="lpm-fld">
              <label className="lpm-l">Work email</label>
              <input className="lpm-i" placeholder="you@company.com" autoFocus value={data.email} onChange={e=>upd('email',e.target.value)}/>
            </div>
            <div className="lpm-fld">
              <label className="lpm-l">Company name</label>
              <input className="lpm-i" placeholder="Acme Co." value={data.company} onChange={e=>upd('company',e.target.value)}/>
            </div>
            <div className="lpm-fld">
              <label className="lpm-l">LinkedIn profile <span style={{color:'var(--ink-3)',fontWeight:400,textTransform:'none',letterSpacing:'normal'}}>· optional</span></label>
              <input className="lpm-i" placeholder="linkedin.com/in/…" value={data.linkedin} onChange={e=>upd('linkedin',e.target.value)}/>
            </div>
          </>}

          {step===1 && <>
            <div className="lpm-fld">
              <label className="lpm-l">Business category</label>
              <div className="lpm-chips">
                {['D2C / Ecommerce','Fintech','Subscription','Food delivery','Quick commerce','Mobility','Marketplace','Loyalty / rewards','Consumer app','Other'].map(c=>
                  <span key={c} className={'lpm-chip '+(data.category===c?'on':'')} onClick={()=>upd('category',c)}>{c}</span>
                )}
              </div>
            </div>
            <div className="lpm-fld">
              <label className="lpm-l">Monthly active users</label>
              <div className="lpm-chips">
                {['<10k','10–100k','100k–1M','1M–10M','10M+'].map(m=>
                  <span key={m} className={'lpm-chip '+(data.mau===m?'on':'')} onClick={()=>upd('mau',m)}>{m}</span>
                )}
              </div>
            </div>
            <div className="lpm-fld">
              <label className="lpm-l">Monthly campaign / reward spend</label>
              <div className="lpm-chips">
                {['<₹5L','₹5–25L','₹25L–1Cr','₹1–5Cr','₹5Cr+'].map(s=>
                  <span key={s} className={'lpm-chip '+(data.spend===s?'on':'')} onClick={()=>upd('spend',s)}>{s}</span>
                )}
              </div>
            </div>
            <div className="lpm-fld">
              <label className="lpm-l">Campaigns launched per month</label>
              <div className="lpm-chips">
                {['1–2','3–5','5–10','10–25','25+'].map(s=>
                  <span key={s} className={'lpm-chip '+(data.launches===s?'on':'')} onClick={()=>upd('launches',s)}>{s}</span>
                )}
              </div>
            </div>
          </>}

          {step===2 && <>
            <div className="lpm-fld">
              <label className="lpm-l">Which offers do you run today? <span style={{color:'var(--ink-3)',fontWeight:400,textTransform:'none',letterSpacing:'normal'}}>· select all</span></label>
              <div className="lpm-chips">
                {['Cashback','Discounts','Coupons','Wallet top-ups','Loyalty / Rewards','Referrals','Pre-load credits','Subscriptions','Bundles'].map(o=>
                  <span key={o} className={'lpm-chip '+(data.offers.includes(o)?'on':'')} onClick={()=>toggleOffer(o)}>{o}</span>
                )}
              </div>
            </div>
            <div className="lpm-fld">
              <label className="lpm-l">How are campaigns currently planned?</label>
              <div className="lpm-chips">
                {['Excel / Sheets','CRM tool (Braze, MoEngage, etc.)','Agency / vendor','Gut feeling','Internal dashboards','In-house data team'].map(p=>
                  <span key={p} className={'lpm-chip '+(data.planning===p?'on':'')} onClick={()=>upd('planning',p)}>{p}</span>
                )}
              </div>
            </div>
          </>}

          {step===3 && <>
            <div className="lpm-fld">
              <label className="lpm-l">Your biggest concern right now</label>
              <div className="lpm-chips">
                {['Profitability of offers','Repeat purchase','Reward abuse','Low redemption','Margin pressure','Retention','Loyalty engagement'].map(c=>
                  <span key={c} className={'lpm-chip '+(data.concern===c?'on':'')} onClick={()=>upd('concern',c)}>{c}</span>
                )}
              </div>
            </div>
            <div className="lpm-fld">
              <label className="lpm-l">Current retention or campaign challenge <span style={{color:'var(--ink-3)',fontWeight:400,textTransform:'none',letterSpacing:'normal'}}>· optional</span></label>
              <textarea className="lpm-i" rows="3" placeholder="e.g. cashback offers eating into margin, dormant users not coming back, finance & marketing disconnected…" value={data.challenge} onChange={e=>upd('challenge',e.target.value)} style={{resize:'vertical',minHeight:90}}/>
            </div>
            <div className="lpm-fld">
              <label className="lpm-l">Open to a future product / strategy survey?</label>
              <div className="lpm-chips">
                {['Yes, happy to','Maybe later','No thanks'].map(s=>
                  <span key={s} className={'lpm-chip '+(data.survey===s?'on':'')} onClick={()=>upd('survey',s)}>{s}</span>
                )}
              </div>
            </div>
          </>}
        </div>

        {/* Footer */}
        <div style={{padding:'18px 32px',borderTop:'1px solid var(--line)',display:'flex',alignItems:'center',gap:10,background:'var(--bg-2)'}}>
          {step>0 && <button className="lp-btn" onClick={()=>setStep(s=>s-1)}>← Back</button>}
          <div style={{flex:1,fontSize:11.5,color:'var(--ink-3)'}}>{step<3? 'Step '+(step+1)+' of '+steps.length : 'Final step'}</div>
          {step<steps.length-1
            ? <button className="lp-btn accent" disabled={!canNext} onClick={()=>setStep(s=>s+1)} style={{opacity:canNext?1:.5,pointerEvents:canNext?'auto':'none'}}>Continue →</button>
            : <button className="lp-btn accent" disabled={!canNext} onClick={()=>setSubmitted(true)} style={{opacity:canNext?1:.5,pointerEvents:canNext?'auto':'none'}}>Submit request</button>
          }
        </div>
      </>)}
    </div>
  </div>;
}

window.LeadModal = LeadModal;
